<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Registro de Usuario</ion-title>
    <ion-back-button defaultHref="login" slot="start"></ion-back-button>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-card>
    <ion-img src="../../assets/icon/img/nutrimove.webp" class="background"></ion-img>
    <div class="content">
    </div>
    <form (ngSubmit)="onSubmit()">
      <ion-item>
        <ion-label position="floating">RUT</ion-label>
        <ion-input [(ngModel)]="user.rut" name="rut" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Nombre de Usuario</ion-label>
        <ion-input [(ngModel)]="user.nombre_user" name="nombre_user" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input [(ngModel)]="user.email" name="email" type="email" required></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Contraseña</ion-label>
        <ion-input [(ngModel)]="user.contrasena" name="password" type="password" required>
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="floating">Repetir Contraseña</ion-label>
        <ion-input [(ngModel)]="repeatPassword" name="repeatPassword" type="password" required>
          <ion-input-password-toggle slot="end"></ion-input-password-toggle>
        </ion-input>
      </ion-item>
      <ion-button expand="full" type="submit">Registrar</ion-button>
    </form> 
  </ion-card>
</ion-content>





<script>
  var Fn = {
      validaRut: function(rutCompleto) {
          if (!/^[0-9]+-[0-9kK]{1}$/.test(rutCompleto))
              return false;
          var tmp = rutCompleto.split('-');
          var digv = tmp[1];
          var rut = tmp[0];
          if (digv == 'K') digv = 'k';
          return (Fn.dv(rut) == digv);
      },
      dv: function(T) {
          var M = 0,
              S = 1;
          for (; T; T = Math.floor(T / 10))
              S = (S + T % 10 * (9 - M++ % 6)) % 11;
          return S ? S - 1 : 'k';
      }
  }
  //1.-  Poner placeholder:
  $("#order_shipping_address_taxid").attr("placeholder", "xxxxxxxx-x (sin puntos)")
  $("#order_billing_address_taxid").attr("placeholder", "xxxxxxxx-x (sin puntos)")
  // 2.- Validar on Submit
  $("#checkout").submit(function(evt) {
      let sameAsBilling = $("#shipping_same_as_billing").is(":checked");
      let rutShipping = $("#order_shipping_address_taxid").val();
      let rutBilling = $("#order_billing_address_taxid").val();
      if (sameAsBilling) {
          if (Fn.validaRut(rutShipping)) {
              return;
          } else {
              evt.preventDefault();
              alert("Formato de RUT debe ser xxxxxxxx-x sin puntos");
          }
      } else {
          console.log("validar dos rut:" + rutShipping + "&" + rutBilling);
          if (Fn.validaRut(rutShipping)) {
              return;
          } else {
              evt.preventDefault();
              alert("Formato de RUT en dirección de envio debe ser xxxxxxxx-x sin puntos");
          }
          if (Fn.validaRut(rutBilling)) {
              return;
          } else {
              evt.preventDefault();
              alert("Formato de RUT en dirección de facturación debe ser xxxxxxxx-x sin puntos");
          }
      }
  });
  </script>
